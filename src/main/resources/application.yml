spring:
  application:
    name: taskflow
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taskflow?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      # "update" is convenient for development. For production use a migration
      # tool (Flyway/Liquibase) and set DDL_AUTO=validate.
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

app:
  jwt:
    # Required, at least 32 characters. Generate one with: openssl rand -base64 48
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  storage:
    dir: ${STORAGE_DIR:./uploads}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
